<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes | Distribuciones Logística, S.A.</title>

  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-tipo="REPORTE">

  <!-- MENU (la clase "activa" marca la pagina actual) -->
  <nav class="menu" aria-label="Módulos">
      <a href="../index.html" aria-label="Inicio"><i class="fa-solid fa-house"></i><span>Inicio</span></a>
    <a href="productos.html" aria-label="Productos"><i class="fa-solid fa-box"></i><span>Productos</span></a>
    <a href="proveedores.html" aria-label="Proveedores"><i class="fa-solid fa-building-user"></i><span>Proveedores</span></a>
    <a href="clientes.html" aria-label="Clientes"><i class="fa-solid fa-users"></i><span>Clientes</span></a>
    <a href="entradas.html" aria-label="Entradas"><i class="fa-solid fa-plus"></i><span>Entradas</span></a>
    <a href="despachos.html" aria-label="Despachos"><i class="fa-solid fa-minus"></i><span>Despachos</span></a>
    <a href="ajustes.html"  aria-label="Ajustes"><i class="fa-solid fa-scale-balanced"></i><span>Ajustes</span></a>
    <a href="reportes.html" class="activa" aria-label="Reportes"  aria-current="page"><i class="fa-solid fa-chart-column"></i><span>Reportes</span></a>
  </nav>

  <main>
    <header><h1>Reportes</h1><p>Realice consultas de productos</p></header>
    <p id="mensaje" class="mensaje" role="status"></p>

    <section class="crud">
      <!--  -->
      <form id="formulario" class="panel">
        <h2 id="titulo-form">Filtros de reporte</h2>

        <!--Busqueda de productos-->
        <label>Producto <select id="codigo"></select></label>

        <!--Campos de fechas de inicio a final-->
        <div id="grupo-fechas">
            <label>
                desde <input type="date" id="fecha_inicio">
            </label>
            <label>
                hasta <input type="date" id="fecha_hasta">
            </label>
        </div>

        <br>
        </form>

        <!-- Tabla de salida que muestra los resultados de los datos introducidos para el reporte -->
        <div class="panel">
            <div class="tabla-scroll">
                <table border="1px" id="tabla_Reporte">
                    <thead>
                    <tr>
                            <th>Fecha</th> <th>movimientos</th> <th>Producto</th> <th>Cantidad</th>
                            <th>Proveedor</th> <th>Total</th>
                        </tr>
                    </thead>


                    <!--Tabla provisional, aquí van los datos-->
                    <tbody id="tablaReporte_datos">

                    </tbody>
                    
                </table>
            </div>
        </div>
        <br>
        <br>

            <!--Botones de exportar y limpiar campos-->
            <div class="fila">
            <button type="button" class="principal-btn" id="export">
                Exportar a CSV
            </button>

            <button type="button" id="limpiar">Limpiar</button>
            </div>
        
    </section>
  </main>
  <script src="../js/reportes.js"></script>

</body>
</html>
